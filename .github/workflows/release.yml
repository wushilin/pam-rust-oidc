name: Build Linux PAM module releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux:8
            artifact: pam-rust-oidc-rocky8-x86_64
          - image: ubuntu:22.04
            artifact: pam-rust-oidc-ubuntu22.04-x86_64
          - image: ubuntu:24.04
            artifact: pam-rust-oidc-ubuntu24.04-x86_64
          - image: debian:12
            artifact: pam-rust-oidc-debian12-x86_64
          - image: debian:13
            artifact: pam-rust-oidc-debian13-x86_64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build in target distribution
        env:
          BUILD_IMAGE: ${{ matrix.image }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            --env ARTIFACT_NAME \
            "$BUILD_IMAGE" \
            bash -euo pipefail -c '
              if command -v dnf >/dev/null 2>&1; then
                dnf -y install gcc gcc-c++ make pam-devel curl ca-certificates perl
              else
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential libpam0g-dev curl ca-certificates perl
              fi
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.92.0
              source /root/.cargo/env
              cargo build --release --locked
              install -D -m 0644 target/release/libpam_rust_oidc.so "dist/${ARTIFACT_NAME}.so"
            '

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.so
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Write checksums
        run: cd release-assets && sha256sum *.so > SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release-assets/*.so
            release-assets/SHA256SUMS
